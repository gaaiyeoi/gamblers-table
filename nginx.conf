# Gambler's Table 生产静态托管配置
# 内部监听 8000，对外通过 docker-compose 端口映射暴露
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退：未知路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
